<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theki Productions — Coming Soon</title>
  <meta name="description" content="Theki Productions. Cinematic Visuals & Production. Coming Soon. Book your production now.">
  
  <!-- Premium Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM: ULTRA-GLASSMORPHISM & AMBER FLUID DEPTH
       ========================================================================== */
    :root {
      --bg-dark: #000000;
      --glass-surface: rgba(255, 255, 255, 0.04);
      --glass-surface-hover: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-highlight: rgba(255, 255, 255, 0.28);
      --glass-inner-bevel: inset 0 1px 1px rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.95), 0 20px 40px -15px rgba(0, 0, 0, 0.85);
      
      --amber-glow: #ff7700;
      --gold-accent: #f59e0b;
      --text-white: #ffffff;
      --text-sub: #9ca3af;
      --text-muted: #6b7280;

      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Space Grotesk', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* Ambient dynamic spotlight following cursor */
    #spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle 750px at var(--mouse-x, 50%) var(--mouse-y, 45%), rgba(255, 119, 0, 0.09), transparent 75%);
      transition: background 0.1s ease;
    }

    /* ==========================================================================
       BACKGROUND LOGO WATERMARK & 3D LIGHT RIBBONS
       ========================================================================== */
    .bg-logo-layer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .bg-logo-img {
      width: min(85vw, 680px);
      height: auto;
      opacity: 0.38;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 80px rgba(255, 119, 0, 0.35)) contrast(1.15);
      transform: translateY(-5%) scale(1);
      animation: floatLogo 8s ease-in-out infinite alternate;
      transition: transform 0.3s ease;
    }

    @keyframes floatLogo {
      0% {
        transform: translateY(-6%) scale(0.98);
        filter: drop-shadow(0 0 60px rgba(255, 119, 0, 0.25));
      }
      100% {
        transform: translateY(-3%) scale(1.02);
        filter: drop-shadow(0 0 90px rgba(255, 140, 0, 0.45));
      }
    }

    /* Background 3D Glowing Fluid Canvas */
    #ribbon-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    /* Cinematic Film Grain Texture */
    .grain-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* ==========================================================================
       PAGE STRUCTURE (GLASS LAYER)
       ========================================================================== */
    .page-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.2rem 1.8rem 1.8rem;
    }

    /* Top Glass Header Bar */
    .top-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Frosted Top Pill Badge */
    .glass-pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-highlight);
      border-radius: 999px;
      padding: 0.45rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), var(--glass-inner-bevel);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .glass-pill-badge:hover {
      background: var(--glass-surface-hover);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .badge-sparkle {
      color: #ff9900;
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* Audio Controller Glass Pill */
    .audio-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-highlight);
      border-radius: 999px;
      padding: 0.45rem 1.15rem;
      cursor: pointer;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), var(--glass-inner-bevel);
    }

    .audio-toggle-btn:hover {
      background: var(--glass-surface-hover);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .equalizer-wave {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
    }

    .eq-bar {
      width: 2.5px;
      height: 3px;
      background: #ffaa00;
      border-radius: 1px;
      transition: height 0.15s ease;
    }

    .audio-playing .eq-bar:nth-child(1) { animation: eqPulse 0.8s infinite alternate ease-in-out; }
    .audio-playing .eq-bar:nth-child(2) { animation: eqPulse 0.5s infinite alternate ease-in-out 0.2s; }
    .audio-playing .eq-bar:nth-child(3) { animation: eqPulse 0.9s infinite alternate ease-in-out 0.1s; }
    .audio-playing .eq-bar:nth-child(4) { animation: eqPulse 0.6s infinite alternate ease-in-out 0.3s; }

    @keyframes eqPulse {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    /* ==========================================================================
       HERO CENTERPIECE & HEAVY GLASSMORPHISM CARD
       ========================================================================== */
    .hero-section {
      width: 100%;
      max-width: 680px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 0;
    }

    /* Main Headline matching Reference */
    .headline-coming-soon {
      font-size: clamp(3rem, 7.5vw, 4.8rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: #ffffff;
      margin-bottom: 2.4rem;
      text-shadow: 0 4px 35px rgba(0, 0, 0, 0.9);
    }

    /* Heavily Glassified Card (Ultra Frosted Glass) */
    .ultra-glass-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-highlight);
      border-radius: 32px;
      padding: 3.4rem 2.8rem 3rem;
      box-shadow: var(--glass-shadow), var(--glass-inner-bevel);
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ultra-glass-card:hover {
      box-shadow: 0 50px 120px -20px rgba(0, 0, 0, 0.98), 
                  0 0 50px rgba(255, 119, 0, 0.15),
                  var(--glass-inner-bevel);
      border-color: rgba(255, 255, 255, 0.22);
    }

    /* Refractive top edge shine */
    .ultra-glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    }

    .card-title {
      font-size: clamp(1.5rem, 3.5vw, 1.95rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    .card-subtitle {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--text-sub);
      font-weight: 400;
      max-width: 460px;
      margin: 0 auto 2.4rem;
    }

    /* Booking & Contact Action Area */
    .actions-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Primary Prominent "Book Now" Button */
    .btn-book-now {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #f4f4f5 100%);
      color: #000000;
      text-decoration: none;
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 1.05rem 2.2rem;
      font-family: var(--font-main);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4), 0 10px 25px rgba(0, 0, 0, 0.6);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-book-now:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 45px rgba(255, 255, 255, 0.7), 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    .btn-book-now:active {
      transform: scale(0.98);
    }

    .btn-icon {
      font-size: 1.15rem;
    }

    /* Direct Contact Line (Phone display) */
    .contact-details-box {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: #e4e4e7;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0.4rem 1.1rem;
      transition: all 0.2s ease;
    }

    .contact-details-box:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .phone-highlight {
      color: #ff9900;
      font-weight: 600;
    }

    /* Waitlist Quick Input Pill */
    .waitlist-quick-row {
      width: 100%;
      display: flex;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    .input-glass-pill {
      flex: 1;
      background: rgba(10, 10, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .input-glass-pill::placeholder {
      color: #71717a;
    }

    .input-glass-pill:focus {
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(10, 10, 15, 0.85);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 119, 0, 0.2);
    }

    .btn-quick-waitlist {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .btn-quick-waitlist:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .feedback-note {
      font-size: 0.85rem;
      color: #38ef7d;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .feedback-note.show {
      opacity: 1;
    }

    /* ==========================================================================
       GIANT HOLLOW BOTTOM TYPOGRAPHY ("Waitlist" from Reference)
       ========================================================================== */
    .giant-outline-wrap {
      width: 100%;
      text-align: center;
      overflow: hidden;
      margin-top: 1.5rem;
      pointer-events: none;
      user-select: none;
    }

    .giant-outline-text {
      font-size: clamp(4.5rem, 16vw, 11.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.85;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.11);
      opacity: 0.65;
      display: inline-block;
      transform: translateY(12%);
    }

    /* Minimalist Footer */
    .bottom-footer {
      width: 100%;
      text-align: center;
      font-size: 0.78rem;
      color: #52525b;
      letter-spacing: 0.5px;
      padding-top: 0.5rem;
    }

    .bottom-footer a {
      color: #a1a1aa;
      text-decoration: none;
    }

    /* ==========================================================================
       RESPONSIVE ADJUSTMENTS
       ========================================================================== */
    @media (max-width: 640px) {
      .ultra-glass-card {
        padding: 2.4rem 1.4rem 2.2rem;
        border-radius: 24px;
      }
      .waitlist-quick-row {
        flex-direction: column;
      }
      .btn-quick-waitlist {
        width: 100%;
      }
      .bg-logo-img {
        width: 95vw;
      }
    }
  </style>
</head>

  <!-- Page Layout -->
  <div class="page-container">

    <!-- Center Section: Headline & Heavily Glassified Card -->

      <div class="ultra-glass-card">

        </p>

  <!-- ==========================================================================
       VANILLA JAVASCRIPT:
       1. 3D Glowing Amber Ribbon Dynamics
       2. Web Audio Ambient Sound & Click Feedback
       3. "Book Now" Click Handling & Telephony Redirect
       ========================================================================== */
  <script>
    (function() {
      'use strict';

      const CONTACT_PHONE = '+9779769407270';

      /* ----------------------------------------------------------------------
         1. 3D GLOWING AMBER RIBBONS (CANVAS FLUID DYNAMICS)
         ---------------------------------------------------------------------- */
      const canvas = document.getElementById('ribbon-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let mouseX = window.innerWidth * 0.5;
      let mouseY = window.innerHeight * 0.45;
      let targetMouseX = mouseX;
      let targetMouseY = mouseY;
      let time = 0;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // Spotlight tracking
      const spotlight = document.getElementById('spotlight');
      window.addEventListener('mousemove', (e) => {
        targetMouseX = e.clientX;
        targetMouseY = e.clientY;
        spotlight.style.setProperty('--mouse-x', `${e.clientX}px`);
        spotlight.style.setProperty('--mouse-y', `${e.clientY}px`);
      }, { passive: true });

      function renderRibbons() {
        mouseX += (targetMouseX - mouseX) * 0.05;
        mouseY += (targetMouseY - mouseY) * 0.05;
        time += 0.012;

        ctx.clearRect(0, 0, width, height);

        const cx = width * 0.5 + (mouseX - width * 0.5) * 0.12;
        const cy = height * 0.4 + (mouseY - height * 0.5) * 0.12;

        drawFluidRibbon(cx, cy, 300, 150, '#ff7700', 36, 0.42, 0);
        drawFluidRibbon(cx, cy, 340, 170, '#ff9900', 18, 0.30, 1.2);
        drawFluidRibbon(cx, cy, 260, 120, '#ff4400', 12, 0.50, 2.4);

        requestAnimationFrame(renderRibbons);
      }

      function drawFluidRibbon(centerX, centerY, radiusX, radiusY, color, blur, opacity, offset) {
        ctx.save();
        ctx.beginPath();

        const points = 80;
        for (let i = 0; i <= points; i++) {
          const angle = (i / points) * Math.PI * 2;
          const wave = Math.sin(angle * 2 + time + offset) * 35 + Math.cos(angle * 3 - time) * 20;
          
          const rx = radiusX + wave;
          const ry = radiusY + wave * 0.6;

          const x = centerX + Math.cos(angle) * rx;
          const y = centerY + Math.sin(angle) * ry;

          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.closePath();

        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.5;
        ctx.globalAlpha = opacity;
        ctx.stroke();

        ctx.shadowBlur = blur * 0.3;
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#ffffff';
        ctx.globalAlpha = opacity * 0.6;
        ctx.stroke();

        ctx.restore();
      }

      renderRibbons();

      /* ----------------------------------------------------------------------
         2. WEB AUDIO API SOUND DESIGN
         ---------------------------------------------------------------------- */
      let audioCtx = null;
      let isPlaying = false;
      let droneGain = null;
      let osc1 = null;
      let osc2 = null;
      let filter = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function startAudio() {
        const ctx = getAudioContext();
        if (!ctx || isPlaying) return;

        try {
          droneGain = ctx.createGain();
          droneGain.gain.setValueAtTime(0.001, ctx.currentTime);
          droneGain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 2.5);

          filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(160, ctx.currentTime);
          filter.Q.value = 3.5;

          osc1 = ctx.createOscillator();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(55, ctx.currentTime);

          osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(110, ctx.currentTime);
          osc2.detune.value = 6;

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(droneGain);
          droneGain.connect(ctx.destination);

          osc1.start();
          osc2.start();

          isPlaying = true;
          document.getElementById('audio-toggle').classList.add('audio-playing');
          document.getElementById('audio-label').textContent = 'Sound: ON';
        } catch (e) {}
      }

      function stopAudio() {
        if (!audioCtx || !isPlaying) return;
        try {
          if (droneGain) {
            droneGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            setTimeout(() => {
              if (osc1) { osc1.stop(); osc1.disconnect(); }
              if (osc2) { osc2.stop(); osc2.disconnect(); }
              isPlaying = false;
            }, 800);
          }
          document.getElementById('audio-toggle').classList.remove('audio-playing');
          document.getElementById('audio-label').textContent = 'Sound: OFF';
        } catch (e) {}
      }

      function playChime() {
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.05);

            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2 + i * 0.05);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + 1.2 + i * 0.05);
          });
        } catch (e) {}
      }

      const audioToggle = document.getElementById('audio-toggle');
      audioToggle.addEventListener('click', () => {
        if (!isPlaying) {
          startAudio();
          playChime();
        } else {
          stopAudio();
        }
      });

      /* ----------------------------------------------------------------------
         3. "BOOK NOW" REDIRECTION & ACTIONS
         ---------------------------------------------------------------------- */
      const bookNowBtn = document.getElementById('btn-book-now');
      bookNowBtn.addEventListener('click', (e) => {
        playChime();
        // Redirects to tel:+9779769407270 directly
      });

      /* ----------------------------------------------------------------------
         4. QUICK WAITLIST FORM
         ---------------------------------------------------------------------- */
      const quickForm = document.getElementById('quick-waitlist-form');
      const emailInput = document.getElementById('waitlist-email');
      const feedback = document.getElementById('feedback-note');

      quickForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (email) {
          playChime();
          feedback.textContent = '✓ You are on the waitlist! We will be in touch.';
          feedback.classList.add('show');
          emailInput.value = '';
          setTimeout(() => {
            feedback.classList.remove('show');
          }, 4000);
        }
      });

    })();
  </script>
