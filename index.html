<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theki Productions — Coming Soon</title>
  <meta name="description" content="Theki Productions - Join our waitlist. Receive the latest updates and insights straight to your inbox. Coming Soon.">
  
  <!-- Premium Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM (MATCHING REFERENCE EXACTLY)
       Ultra-clean dark Framer glassmorphism + 3D fluid amber light ribbons
       ========================================================================== */
    :root {
      --bg-dark: #000000;
      --card-bg: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-top: rgba(255, 255, 255, 0.28);
      --card-inner-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
      --card-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.95), 0 20px 40px -15px rgba(0, 0, 0, 0.8);
      --text-white: #ffffff;
      --text-sub: #9ca3af;
      --text-muted: #6b7280;
      --orange-glow: #ff7700;
      --amber-accent: #f59e0b;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Space Grotesk', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* Ambient dynamic spotlight */
    #spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle 700px at var(--mouse-x, 50%) var(--mouse-y, 40%), rgba(255, 119, 0, 0.08), transparent 75%);
      transition: background 0.1s ease;
    }

    /* Background 3D Glowing Ribbon Canvas */
    #ribbon-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Subtle Film Grain */
    .grain-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Main Container */
    .page-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.2rem 1.5rem 1.5rem;
    }

    /* ==========================================================================
       HEADER / TOP PILL & SOUND CONTROLLER
       ========================================================================== */
    .top-header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Waitlist Top Pill (Identical to Reference) */
    .waitlist-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0.42rem 1.15rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .waitlist-badge:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .badge-icon {
      font-size: 0.85rem;
      color: #ff9d00;
      display: inline-block;
    }

    /* Audio Controller Pill ("It sounds cool") */
    .audio-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 0.42rem 1.1rem;
      cursor: pointer;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .audio-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .equalizer-wave {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
    }

    .eq-bar {
      width: 2.5px;
      height: 3px;
      background: #ffaa00;
      border-radius: 1px;
      transition: height 0.15s ease;
    }

    .audio-playing .eq-bar:nth-child(1) { animation: eqPulse 0.8s infinite alternate ease-in-out; }
    .audio-playing .eq-bar:nth-child(2) { animation: eqPulse 0.5s infinite alternate ease-in-out 0.2s; }
    .audio-playing .eq-bar:nth-child(3) { animation: eqPulse 0.9s infinite alternate ease-in-out 0.1s; }
    .audio-playing .eq-bar:nth-child(4) { animation: eqPulse 0.6s infinite alternate ease-in-out 0.3s; }

    @keyframes eqPulse {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    /* ==========================================================================
       HERO CENTERPIECE (LOGO, COMING SOON, FROSTED CARD)
       ========================================================================== */
    .hero-section {
      width: 100%;
      max-width: 720px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.5rem 0 2rem;
    }

    /* Official Theki Productions Logo */
    .theki-logo-wrapper {
      margin-bottom: 0.8rem;
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .theki-logo-img {
      width: 210px;
      height: auto;
      display: block;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 35px rgba(255, 119, 0, 0.25));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
    }

    .theki-logo-wrapper:hover .theki-logo-img {
      transform: scale(1.04);
      filter: drop-shadow(0 0 50px rgba(255, 150, 0, 0.5));
    }

    /* Headline: Coming soon! (Exact font and weight from Reference) */
    .headline-coming-soon {
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: #ffffff;
      margin-bottom: 2.2rem;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
    }

    /* ==========================================================================
       FROSTED GLASS CARD (EXACT REPLICA OF REFERENCE)
       ========================================================================== */
    .glass-card {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(45px);
      -webkit-backdrop-filter: blur(45px);
      border: 1px solid var(--card-border);
      border-top: 1px solid var(--card-border-top);
      border-radius: 28px;
      padding: 3.2rem 2.5rem 2.8rem;
      box-shadow: var(--card-shadow), var(--card-inner-shadow);
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      box-shadow: 0 50px 120px -20px rgba(0, 0, 0, 0.98), 
                  0 0 40px rgba(255, 119, 0, 0.12),
                  var(--card-inner-shadow);
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Inner subtle glow highlight on card top */
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
    }

    .card-title {
      font-size: clamp(1.4rem, 3.2vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.7rem;
    }

    .card-subtitle {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text-sub);
      font-weight: 400;
      max-width: 440px;
      margin: 0 auto 2.2rem;
    }

    /* Form Container */
    .waitlist-form {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* Input Pill */
    .input-pill {
      flex: 1;
      background: rgba(10, 10, 15, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .input-pill::placeholder {
      color: #71717a;
    }

    .input-pill:focus {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(10, 10, 15, 0.9);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 119, 0, 0.2);
    }

    /* Join Waitlist Button (Glowing White Pill matching Reference) */
    .btn-join {
      background: #ffffff;
      color: #050508;
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 0.85rem 1.6rem;
      font-family: var(--font-main);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .btn-join:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6), 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .btn-join:active {
      transform: scale(0.97);
    }

    /* Dynamic feedback toast */
    .form-feedback {
      position: absolute;
      bottom: -34px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .form-feedback.show {
      opacity: 1;
      transform: translateY(0);
    }

    .form-feedback.success {
      color: #38ef7d;
      text-shadow: 0 0 10px rgba(56, 239, 125, 0.4);
    }

    .form-feedback.error {
      color: #ff5555;
    }

    /* ==========================================================================
       SOCIAL ICON BUTTONS (MATCHING REFERENCE)
       ========================================================================== */
    .social-links-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a1a1aa;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.2s ease, fill 0.2s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 119, 0, 0.2);
    }

    .social-btn:hover svg {
      transform: scale(1.1);
      fill: #ffffff;
    }

    /* ==========================================================================
       GIANT HOLLOW BOTTOM TYPOGRAPHY ("Waitlist" from Reference)
       ========================================================================== */
    .giant-outline-wrap {
      width: 100%;
      text-align: center;
      overflow: hidden;
      margin-top: 1.5rem;
      pointer-events: none;
      user-select: none;
    }

    .giant-outline-text {
      font-size: clamp(4.5rem, 16vw, 11.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.85;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.11);
      opacity: 0.65;
      display: inline-block;
      transform: translateY(12%);
    }

    /* Minimalist Footer */
    .bottom-footer {
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: #52525b;
      letter-spacing: 0.5px;
      padding-top: 0.5rem;
    }

    .bottom-footer a {
      color: #71717a;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .bottom-footer a:hover {
      color: #ffffff;
    }

    /* ==========================================================================
       RESPONSIVE ADJUSTMENTS
       ========================================================================== */
    @media (max-width: 640px) {
      .glass-card {
        padding: 2.2rem 1.4rem 2rem;
        border-radius: 22px;
      }
      .waitlist-form {
        flex-direction: column;
        width: 100%;
      }
      .input-pill {
        width: 100%;
      }
      .btn-join {
        width: 100%;
      }
      .theki-logo-img {
        width: 170px;
      }
    }
  </style>
</head>

  <!-- Page Layout -->

  <!-- ==========================================================================
       VANILLA JAVASCRIPT:
       1. 3D Glowing Amber Ribbon Fluid Dynamics (Canvas)
       2. Web Audio API Ambient Sound Synthesizer ("it sound be cool")
       3. Interactive Form Handling
       ========================================================================== */
  <script>
    (function() {
      'use strict';

      /* ----------------------------------------------------------------------
         1. 3D GLOWING AMBER RIBBONS (CANVAS FLUID DYNAMICS)
         Recreates the exact glowing orange/copper fluid curves from reference.jpeg
         ---------------------------------------------------------------------- */
      const canvas = document.getElementById('ribbon-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let mouseX = window.innerWidth * 0.5;
      let mouseY = window.innerHeight * 0.45;
      let targetMouseX = mouseX;
      let targetMouseY = mouseY;
      let time = 0;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // Spotlight tracking
      const spotlight = document.getElementById('spotlight');
      window.addEventListener('mousemove', (e) => {
        targetMouseX = e.clientX;
        targetMouseY = e.clientY;
        spotlight.style.setProperty('--mouse-x', `${e.clientX}px`);
        spotlight.style.setProperty('--mouse-y', `${e.clientY}px`);
      }, { passive: true });

      function renderRibbons() {
        // Smooth mouse lag
        mouseX += (targetMouseX - mouseX) * 0.05;
        mouseY += (targetMouseY - mouseY) * 0.05;
        time += 0.012;

        ctx.clearRect(0, 0, width, height);

        // Center calculation
        const cx = width * 0.5 + (mouseX - width * 0.5) * 0.12;
        const cy = height * 0.4 + (mouseY - height * 0.5) * 0.12;

        // Draw multiple glowing fluid ribbons
        drawFluidRibbon(cx, cy, 280, 140, '#ff7700', 36, 0.45, 0);
        drawFluidRibbon(cx, cy, 320, 160, '#ff9900', 18, 0.35, 1.2);
        drawFluidRibbon(cx, cy, 240, 110, '#ff4400', 12, 0.55, 2.4);

        requestAnimationFrame(renderRibbons);
      }

      function drawFluidRibbon(centerX, centerY, radiusX, radiusY, color, blur, opacity, offset) {
        ctx.save();
        ctx.beginPath();

        const points = 80;
        for (let i = 0; i <= points; i++) {
          const angle = (i / points) * Math.PI * 2;
          const wave = Math.sin(angle * 2 + time + offset) * 35 + Math.cos(angle * 3 - time) * 20;
          
          const rx = radiusX + wave;
          const ry = radiusY + wave * 0.6;

          const x = centerX + Math.cos(angle) * rx;
          const y = centerY + Math.sin(angle) * ry;

          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.closePath();

        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.5;
        ctx.globalAlpha = opacity;
        ctx.stroke();

        // Second pass for core brightness
        ctx.shadowBlur = blur * 0.3;
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#ffffff';
        ctx.globalAlpha = opacity * 0.6;
        ctx.stroke();

        ctx.restore();
      }

      renderRibbons();

      /* ----------------------------------------------------------------------
         2. WEB AUDIO API AMBIENT SOUND ("IT SOUND BE COOL")
         Generates:
         - Deep atmospheric cinematic drone
         - Crystal impact chime on submit
         ---------------------------------------------------------------------- */
      let audioCtx = null;
      let isPlaying = false;
      let droneGain = null;
      let osc1 = null;
      let osc2 = null;
      let filter = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function startAudio() {
        const ctx = getAudioContext();
        if (!ctx || isPlaying) return;

        try {
          droneGain = ctx.createGain();
          droneGain.gain.setValueAtTime(0.001, ctx.currentTime);
          droneGain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 2.5);

          filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(160, ctx.currentTime);
          filter.Q.value = 3.5;

          osc1 = ctx.createOscillator();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(55, ctx.currentTime); // A1 note

          osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(110, ctx.currentTime); // A2 note
          osc2.detune.value = 6;

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(droneGain);
          droneGain.connect(ctx.destination);

          osc1.start();
          osc2.start();

          isPlaying = true;
          document.getElementById('audio-toggle').classList.add('audio-playing');
          document.getElementById('audio-label').textContent = 'Sound: ON';
        } catch (e) {
          console.warn('Audio auto-play prevented:', e);
        }
      }

      function stopAudio() {
        if (!audioCtx || !isPlaying) return;
        try {
          if (droneGain) {
            droneGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            setTimeout(() => {
              if (osc1) { osc1.stop(); osc1.disconnect(); }
              if (osc2) { osc2.stop(); osc2.disconnect(); }
              isPlaying = false;
            }, 800);
          }
          document.getElementById('audio-toggle').classList.remove('audio-playing');
          document.getElementById('audio-label').textContent = 'Sound: OFF';
        } catch (e) {}
      }

      function playChime() {
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          // Elegant crystal chord chime
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.05);

            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2 + i * 0.05);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + 1.2 + i * 0.05);
          });
        } catch (e) {}
      }

      const audioToggle = document.getElementById('audio-toggle');
      audioToggle.addEventListener('click', () => {
        if (!isPlaying) {
          startAudio();
          playChime();
        } else {
          stopAudio();
        }
      });

      /* ----------------------------------------------------------------------
         3. FORM SUBMISSION INTERACTION
         ---------------------------------------------------------------------- */
      const form = document.getElementById('waitlist-form');
      const emailInput = document.getElementById('user-email');
      const feedback = document.getElementById('form-feedback');
      const submitBtn = document.getElementById('btn-submit-waitlist');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = emailInput.value.trim();

        if (val) {
          playChime();
          submitBtn.textContent = 'Joined!';
          submitBtn.style.background = '#38ef7d';
          submitBtn.style.color = '#000000';

          feedback.textContent = '✓ You are on the waitlist! Priority screening details sent.';
          feedback.className = 'form-feedback show success';
          emailInput.value = '';

          setTimeout(() => {
            submitBtn.textContent = 'Join Waitlist';
            submitBtn.style.background = '';
            submitBtn.style.color = '';
            feedback.className = 'form-feedback';
          }, 4500);
        }
      });

      // Quick focus helper on top badge
      document.getElementById('top-waitlist-pill').addEventListener('click', () => {
        emailInput.focus();
      });

      // Logo hover sound
      document.getElementById('logo-trigger').addEventListener('click', () => {
        playChime();
      });

    })();
  </script>
</body>
</html>
